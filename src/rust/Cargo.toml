[package]
name = 'osmnxr'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.81'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'osmnxr'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9'
# The graph algorithms live in their own crate (github.com/StrategicProjects/osmnxr-core).
# Pinned exactly: Cargo.lock is vendored for CRAN and the R tests are the
# regression suite for the crate's numbers.
osmnxr-core = '=0.1.0'

[profile.release]
lto = true
codegen-units = 1
opt-level = 2
strip = true
